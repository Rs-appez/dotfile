# Disable the blank line at the start of the prompt for a cleaner look
add_newline = false

# Define the exact order and modules for a minimal, single-line prompt
format = """
$status\
$line_break\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$docker_context\
$python\
$rust\
$terraform\
$line_break\
☕ $character"""

[username]
show_always = false
format = "[$user@]($style)"
style_user = "bold blue"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[$hostname 🌐]($style) "
style = "bold blue"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"

[git_branch]
style = "bold purple"
format = "on [$symbol$branch]($style) "
symbol = " "

[git_status]
style = "bold yellow"
# Breaks out every specific status instead of lumping them together
format = '([\[$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed\]]($style) )'

# Custom symbols for maximum readability
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
staged = "+"
modified = "!"
untracked = "?"
renamed = "»"
deleted = "✘"
conflicted = "💥"
stashed = "📦"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold green)"
vicmd_symbol = "[❮](bold yellow)"

[status]
disabled = false
format = '[\(╯°□°\)╯︵ ┻━┻]($style) '
style = "red"

[python]
format = '[🐍 $version (\($virtualenv\))]($style) '
style = "bold yellow"

[docker_context]
format = "[🐳 $context]($style) "
style = "bold blue"
only_with_files = true

[rust]
format = "[🦀 $version]($style) "
style = "bold red"

[terraform]
detect_folders = [".terraform", "terraform"]
format = "[$symbol$workspace]($style) "
